name: Import verified community visual design V3.4
# Temporary one-use import: add only the new versions/V3.4 folder.
# Never replace existing paths. Remove this workflow after the verified import.

on:
  push:
    branches: [main]
    paths: [.github/workflows/import-community-v34.yml]

permissions: {}

concurrency:
  group: community-visual-import-v3.4
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'Milaro001/community-service-visual-design' && github.ref == 'refs/heads/main' && github.actor == 'Milaro001' && github.event.head_commit.message == 'Import V3.4 delivery into new version folder once'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_PARENT: ${{ github.sha }}
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Download and verify the prepared V3.4 delivery
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/commits/${EXPECTED_PARENT}" > "${RUNNER_TEMP}/community-v34-trigger.json"
          gh api -H 'Accept: application/octet-stream' "repos/${GITHUB_REPOSITORY}/releases/assets/643864852" > "${RUNNER_TEMP}/community-v34.zip"
          python3 - <<'PY'
          import hashlib, json, os, stat, zipfile
          from pathlib import Path, PurePosixPath
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          assert os.environ['GITHUB_EVENT_NAME'] == 'push'
          assert os.environ['GITHUB_REPOSITORY'] == 'Milaro001/community-service-visual-design'
          assert os.environ['GITHUB_ACTOR'] == 'Milaro001'
          assert event['after'] == os.environ['EXPECTED_PARENT']
          assert event['head_commit']['message'] == 'Import V3.4 delivery into new version folder once'
          trigger = json.loads((Path(os.environ['RUNNER_TEMP']) / 'community-v34-trigger.json').read_text())
          assert trigger['sha'] == os.environ['EXPECTED_PARENT']
          assert len(trigger['files']) == 1
          assert trigger['files'][0]['filename'] == '.github/workflows/import-community-v34.yml'
          assert trigger['files'][0]['status'] in {'added', 'modified'}
          archive = Path(os.environ['RUNNER_TEMP']) / 'community-v34.zip'
          expected = '2638d56496cf5fd41fd2d6660431cc57b306de3ee6916a3ffafd72dfa61d15a8'
          assert hashlib.file_digest(archive.open('rb'), 'sha256').hexdigest() == expected, 'Archive checksum mismatch'
          destination = Path(os.environ['RUNNER_TEMP']) / 'community-v34-extracted'
          with zipfile.ZipFile(archive) as bundle:
              for entry in bundle.infolist():
                  path = PurePosixPath(entry.filename)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert '.git' not in path.parts and not stat.S_ISLNK(entry.external_attr >> 16)
                  assert path.parts[0] == 'community-related-visual-design-v3-4'
              bundle.extractall(destination)
          root = destination / 'community-related-visual-design-v3-4'
          expected_files = set()
          for line in (root / 'checksums.sha256').read_text().splitlines():
              digest, relative = line.split('  ', 1)
              path = PurePosixPath(relative)
              assert not path.is_absolute() and '..' not in path.parts
              assert hashlib.file_digest((root / relative).open('rb'), 'sha256').hexdigest() == digest, relative
              expected_files.add(relative)
          actual = {p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file()}
          assert actual == expected_files | {'checksums.sha256'}
          assert len(actual) == 639
          assert (root / 'VERSION').read_text().strip() == 'V3.4'
          assert (root / 'TAG').read_text().strip() == 'v3.4'
          assert (root / 'SKILL.md').is_file() and (root / 'en/SKILL.md').is_file()
          print('Verified V3.4 archive and all 639 delivery files')
          PY
      - name: Add the verified V3.4 folder without modifying existing files
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git clone "https://github.com/${GITHUB_REPOSITORY}.git" "${RUNNER_TEMP}/community-v34-repository"
          cd "${RUNNER_TEMP}/community-v34-repository"
          test "$(git rev-parse HEAD)" = "${EXPECTED_PARENT}"
          python3 - <<'PY'
          import os, shutil, zipfile
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'community-v34-extracted/community-related-visual-design-v3-4'
          repository = Path.cwd()
          assert repository.name == 'community-v34-repository' and (repository / '.git').is_dir()
          version = repository / 'versions/V3.4'
          assert not version.exists(), 'V3.4 path already exists; refuse to replace it'
          import subprocess
          assert not subprocess.check_output(['git', 'ls-files', '--', 'versions/V3.4'])
          destination = version / 'community-related-visual-design-v3-4'
          destination.parent.mkdir(parents=True)
          shutil.copytree(root, destination)
          # Restore executable bits recorded in the source ZIP.
          with zipfile.ZipFile(Path(os.environ['RUNNER_TEMP']) / 'community-v34.zip') as bundle:
              for entry in bundle.infolist():
                  relative = Path(entry.filename).relative_to('community-related-visual-design-v3-4')
                  mode = entry.external_attr >> 16
                  if mode & 0o111:
                      (destination / relative).chmod(mode & 0o777)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- versions/V3.4
          python3 - <<'PY'
          import subprocess
          records = subprocess.check_output(['git', 'diff', '--cached', '--name-status', '-z']).decode().split('\0')
          records = records[:-1]
          assert len(records) == 639 * 2
          for index in range(0, len(records), 2):
              assert records[index] == 'A', 'Only new files may be committed'
              assert records[index + 1].startswith('versions/V3.4/community-related-visual-design-v3-4/')
          print('Only the 639 new V3.4 files are staged; existing paths remain unchanged')
          PY
          git commit -m 'Add complete V3.4 delivery with one shared resource set'
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "${EXPECTED_PARENT}"
          git push origin HEAD:main
